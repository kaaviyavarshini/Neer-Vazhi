<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Pooling Benchmark & Visualizer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.117.0/Build/Cesium/Widgets/widgets.css" />
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.117.0/Build/Cesium/Cesium.js"></script>
  <style>
    body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a0e17; font-family: monospace; color: #fff; }
    #cesiumContainer { width: 100%; height: 100%; position: absolute; }
    #panel {
      position: absolute; top: 16px; left: 16px; z-index: 100;
      background: rgba(10,14,23,0.85); backdrop-filter: blur(8px);
      padding: 16px 20px; border-radius: 8px; font-size: 13px;
      border: 1px solid rgba(255,255,255,0.15); line-height: 1.6;
    }
    #panel b { color: #00e5ff; }
    button {
      background: #00bcd4; color: #000; border: none; font-weight: bold;
      padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-top: 8px;
    }
    button:hover { background: #80d8ff; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="panel">
    <div style="font-size: 15px; font-weight: bold; color: #80d8ff; margin-bottom: 4px;">Priority-Flood Water Model</div>
    <div>Rainfall: <b>200 mm</b> (Synthetic Heavy Day)</div>
    <div>Runoff Coeff C: <b>0.80</b></div>
    <div>Status: <b id="status">Initializing...</b></div>
    <div>Flooded Nodes: <b id="nodes">--</b></div>
    <div>Max Depth: <b id="maxD">--</b></div>
    <button id="btnRun">Trigger Rain Event (200 mm)</button>
  </div>

  <script type="module">
    import { createViewer, flyToStudyArea } from '../js/viewer.js';
    import { initTerrain, show as showTerrain } from '../js/terrain.js';
    import { initPooling, showPooling, getWaterDepth } from '../js/pooling.js';

    async function run() {
      const statusEl = document.getElementById('status');
      const nodesEl = document.getElementById('nodes');
      const maxDEl = document.getElementById('maxD');
      const btn = document.getElementById('btnRun');

      const { viewer } = await createViewer('cesiumContainer');
      statusEl.textContent = 'Loading terrain slab (10x)...';
      await initTerrain(viewer);
      await showTerrain();

      initPooling(viewer);
      flyToStudyArea(viewer, 12.95, 80.2275);

      async function trigger(mm) {
        statusEl.textContent = `Solving Priority-Flood & Runoff (${mm} mm)...`;
        await showPooling({ rainfallMm: mm, runoffCoeff: 0.8 });
        const depth = getWaterDepth();
        let flooded = 0;
        let maxVal = 0;
        for (let i = 0; i < depth.length; i++) {
          if (depth[i] > 0.05) flooded++;
          if (depth[i] > maxVal) maxVal = depth[i];
        }
        nodesEl.textContent = `${flooded.toLocaleString()} cells (>5cm)`;
        maxDEl.textContent = `${maxVal.toFixed(2)} m`;
        statusEl.textContent = 'Water rising (5s animation)...';
      }

      btn.addEventListener('click', () => trigger(200));

      // Auto-trigger initial 150mm event
      await trigger(150);
    }

    window.addEventListener('DOMContentLoaded', run);
  </script>
</body>
</html>
